<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Dashboard</h1>
    </header>
    <nav class="sidebar">
        <h2>My Dashboard</h2>
        <ul>
            <li><a href="#">Overview</a></li>
            <li><a href="#">Sales</a></li>
            <li><a href="#">Customers</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </nav>
    <main class="main">
        <div class="card"><h3>Users</h3><p class="number">1,240</p></div>
        <div class="card"><h3>Sales</h3><p class="number">$8,300</p></div>
        <div class="card"><h3>Orders</h3><p class="number">312</p></div>

    <ul class="legend">
        <li><span class="dot d1"></span>Orders 40%</li>
        <li><span class="dot d2"></span>Sign-ups 30%</li>
        <li><span class="dot d3"></span>Payments 20%</li>
        <li><span class="dot d4"></span>Shipped 10%</li>
    </ul>
</div>
        <div class="card"><h3>Visits</h3><p class="number">5,820</p></div>
        <div class="card"><h3>Refunds</h3><p class="number">7</p></div>
    </main>

</html>
